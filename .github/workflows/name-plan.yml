name: Name plan integration
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'contracts/name-plan/**'
      - 'src/**'
      - 'src-tauri/src/**'
      - 'tests/name-plan*'
      - 'tests/fixtures/name-plan*'
      - 'tests/ui/name-plan*'
      - '.github/workflows/name-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: name-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Archive exact public code for reproducible review
        run: |
          mkdir -p /tmp/name-review
          git rev-parse HEAD > /tmp/name-review/commit.txt
          git archive --format=tar HEAD > /tmp/name-review/source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: name-plan-source-${{ github.run_id }}
          path: /tmp/name-review/
          retention-days: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a5914442
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Archive lock-matched dependencies for offline browser review
        run: tar -czf /tmp/name-node-dependencies.tar.gz package-lock.json node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: name-node-dependencies-${{ github.run_id }}
          path: /tmp/name-node-dependencies.tar.gz
          retention-days: 1
      - name: Name contracts and production adapters
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/name-plan*.test.mjs)
          if (( ${#files[@]} )); then node --test "${files[@]}"; fi
      - run: npm test
      - run: npm run build
