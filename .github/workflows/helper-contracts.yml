name: Swift image helper contracts
on:
  pull_request:
    branches: [dev]
    paths: ['helper/Sources/**', 'tests/swift/**', '.github/workflows/helper-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: RGBA codec and alpha boundary fixture
        run: |
          swiftc helper/Sources/MangaEngine/LayerPNG.swift tests/swift/LayerPNGTests.swift -o "$RUNNER_TEMP/layer-png-tests"
          "$RUNNER_TEMP/layer-png-tests"
      - name: Identify compiler
        id: compiler
        run: echo "id=$(swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: helper/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('helper/Package.swift', 'helper/Package.resolved', 'helper/Sources/**') }}
          restore-keys: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.id }}-
      - name: Compile actual pinned SDK public tensor interface
        run: swift build -c release --package-path helper
