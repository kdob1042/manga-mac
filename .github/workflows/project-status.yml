name: Sync project status

on:
  issues:
    types: [opened, edited, reopened, closed, labeled]
  pull_request_target:
    types: [opened, edited, synchronize, ready_for_review, converted_to_draft, closed, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: ['Check and build Mac app', 'Start issue with draft PR']
    types: [requested, completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report changes without writing
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: project-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    # Never run privileged code from a PR head (including workflow_run artifacts).
    if: github.event_name != 'pull_request_review' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            if (!process.env.PROJECTS_TOKEN) throw new Error('Missing repository secret PROJECTS_TOKEN');
            await require('./.github/scripts/project-sync.cjs').reconcile({
              github, context, core, dryRun: process.env.DRY_RUN === 'true'
            });
