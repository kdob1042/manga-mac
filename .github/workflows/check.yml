name: Check and build Mac app
# Pull requests always run a cheap classifier so skipped heavy jobs report a successful conclusion.
# Normal code-change PRs run the Linux checks.
# Docs-only PRs, dev-to-main promotions, and unchanged branch synchronizations reuse existing validation.
# A merge to dev runs macOS validation only when the pushed tree contains code changes.
# A merge to main packages code changes for distribution.
on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  # Keep dev push validation separate from a dev-to-main PR; the latter must not cancel the former.
  group: manga-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: classify
        name: Decide validation scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.ref || '' }}
          PR_HEAD: ${{ github.event.pull_request.head.ref || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          set_output() {
            echo "run_heavy=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_HEAD" == "dev" && "$PR_BASE" == "main" ]]; then
              set_output false "dev-to-main-promotion"
              exit 0
            fi
            # A main-to-dev sync is cheap only when its actual diff is empty or docs-only.
            # A real main-side hotfix must still receive the full validation.
            files="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              files="$(git diff-tree --no-commit-id --name-only -r "$CURRENT_SHA")"
            else
              files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            fi
          else
            set_output true "manual-run"
            exit 0
          fi

          if [[ -z "$files" ]]; then
            set_output false "no-file-change"
            exit 0
          fi

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "$file" != docs/* && "$file" != *.md ]]; then
              set_output true "code-change"
              exit 0
            fi
          done <<< "$files"

          set_output false "docs-only"

  llm:
    needs: classify
    if: >
      needs.classify.outputs.run_heavy == 'true' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Validate committed dependency locks
        run: |
          mkdir -p review
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > review/metadata.json
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo fetch --locked --manifest-path tests/llm/Cargo.toml
          cargo tree --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin -e features > review/features.txt
      - name: Install media probe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: SDK and real HTTP policy fixtures
        run: |
          env HTTP_PROXY=http://127.0.0.1:1 HTTPS_PROXY=http://127.0.0.1:1 ALL_PROXY=http://127.0.0.1:1 NO_PROXY= cargo test --offline --locked --manifest-path tests/llm/Cargo.toml
          cargo clippy --locked --manifest-path tests/llm/Cargo.toml --all-targets -- -D warnings
      - name: Audit exact candidate dependency closure
        if: always()
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          python scripts/audit_osv.py src-tauri/Cargo.lock review/osv.json
          cargo audit --file src-tauri/Cargo.lock --json > review/rustsec.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: SDK-candidate-review
          path: |
            review/
            src-tauri/Cargo.lock
            src-tauri/src/main.rs
            src-tauri/src/llm.rs
            src-tauri/src/llm_tests.rs
            src-tauri/src/policy_transport.rs
            tests/llm/Cargo.lock

  blender:
    needs: classify
    if: >
      needs.classify.outputs.run_heavy == 'true' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Download fixed official Blender and verify publisher checksum
        run: |
          mkdir -p "$RUNNER_TEMP/blender"
          cd "$RUNNER_TEMP/blender"
          curl --fail --location --proto '=https' -o blender-4.5.13-linux-x64.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz
          curl --fail --location --proto '=https' -o blender-4.5.13.sha256 https://download.blender.org/release/Blender4.5/blender-4.5.13.sha256
          sha256sum --check --ignore-missing blender-4.5.13.sha256
          tar -xf blender-4.5.13-linux-x64.tar.xz
          echo "BLENDER_BIN=$RUNNER_TEMP/blender/blender-4.5.13-linux-x64/blender" >> "$GITHUB_ENV"
          echo "BLENDER_FIXTURES=$GITHUB_WORKSPACE/blender-results" >> "$GITHUB_ENV"
      - name: Actual Blender camera render and save/reopen
        run: python blender/test_real.py "$BLENDER_BIN" "$BLENDER_FIXTURES"
      - name: Validate committed Blender test lock
        run: |
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Actual Rust to Blender IPC and restart
        run: |
          cargo test --locked --manifest-path tests/blender/Cargo.toml
          cargo clippy --locked --manifest-path tests/blender/Cargo.toml --all-targets -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Blender-candidate-review
          path: |
            blender-results/
            src-tauri/Cargo.lock
            src-tauri/src/main.rs
            src-tauri/src/blender.rs
            tests/blender/Cargo.lock

  storage:
    needs: classify
    if: >
      needs.classify.outputs.run_heavy == 'true' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install media probe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install checksum-pinned backup tools
        run: sh scripts/install-backup-tools.sh "$RUNNER_TEMP/manga-backup-tools"
      - run: cargo test --locked --manifest-path tests/storage/Cargo.toml
      - name: Actual restic encrypted roundtrip and retention
        env:
          RESTIC_TEST_BIN: ${{ runner.temp }}/manga-backup-tools/restic
          RCLONE_TEST_BIN: ${{ runner.temp }}/manga-backup-tools/rclone
        run: cargo test --locked --manifest-path tests/storage/Cargo.toml real_restic -- --ignored
      - run: cargo clippy --locked --manifest-path tests/storage/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  web:
    needs: classify
    if: >
      needs.classify.outputs.run_heavy == 'true' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Real Live Manga exporter integration
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          node scripts/live-e2e.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UI-test-results
          path: test-results/

  mac:
    name: macOS validation
    # The macOS runner validates every non-doc change after it is merged to dev.
    # PRs use the Linux jobs above; main uses the release-only job below.
    if: >
      needs.classify.outputs.run_heavy == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: macos-26
    needs: [classify, web, storage, llm, blender]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Identify native compiler cache
        id: native-cache
        run: |
          echo "compiler=$(swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-restore
        with:
          path: helper/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.compiler }}-${{ hashFiles('helper/Package.swift', 'helper/Package.resolved', 'helper/Sources/**') }}
      - name: Build native image engine
        run: |
          swift build -c release --package-path helper
          mkdir -p src-tauri/binaries
          cp helper/.build/release/manga-engine src-tauri/binaries/manga-engine-aarch64-apple-darwin
      # Save successful Swift output even if a later Rust regression fails.
      # The exact compiler/input key and the following build/test gates stay required.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.native-restore.outputs.cache-hit != 'true'
        with:
          path: helper/.build
          key: ${{ steps.native-restore.outputs.cache-primary-key }}
      - name: Install media probe
        run: command -v ffprobe || brew install ffmpeg
      - name: Native regression and static checks
        run: |
          npm run icons
          npm run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --all-targets -- -D warnings
      - name: Build unsigned Apple Silicon validation app and DMG
        run: npm run tauri build -- --target aarch64-apple-darwin -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Manga-Mac-Apple-Silicon-validation
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: macOS release package
    # main is packaged only after the corresponding dev commit was validated.
    needs: classify
    if: >
      needs.classify.outputs.run_heavy == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Identify native compiler cache
        id: native-cache
        run: |
          echo "compiler=$(swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-restore
        with:
          path: helper/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.compiler }}-${{ hashFiles('helper/Package.swift', 'helper/Package.resolved', 'helper/Sources/**') }}
      - name: Build native image engine
        run: |
          swift build -c release --package-path helper
          mkdir -p src-tauri/binaries
          cp helper/.build/release/manga-engine src-tauri/binaries/manga-engine-aarch64-apple-darwin
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.native-restore.outputs.cache-hit != 'true'
        with:
          path: helper/.build
          key: ${{ steps.native-restore.outputs.cache-primary-key }}
      - name: Prepare release bundle
        run: |
          npm run icons
          npm run build
      - name: Build unsigned Apple Silicon release app and DMG
        run: npm run tauri build -- --target aarch64-apple-darwin -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Manga-Mac-Apple-Silicon-unsigned
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
