name: Check and build Mac app
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: manga-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --manifest-path tests/storage/Cargo.toml
      - run: cargo clippy --manifest-path tests/storage/Cargo.toml --all-targets -- -D warnings
      - name: Prepare reproducible review inputs
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          rustfmt --edition 2021 src-tauri/src/main.rs src-tauri/src/storage.rs
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          for path in ['src-tauri/Cargo.lock', 'tests/storage/Cargo.lock', 'src-tauri/src/main.rs', 'src-tauri/src/storage.rs']:
              print('MANGA_REVIEW:' + json.dumps({'path': path, 'content': Path(path).read_text()}))
          PYCODE
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-test-results
          path: test-results/
  mac:
    runs-on: macos-26
    needs: [web, storage]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Build native image engine
        run: |
          swift build -c release --package-path helper
          mkdir -p src-tauri/binaries
          cp helper/.build/release/manga-engine src-tauri/binaries/manga-engine-aarch64-apple-darwin
      - name: Build unsigned Apple Silicon app and DMG
        run: npm run tauri build -- --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: Manga-Mac-Apple-Silicon-unsigned
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
