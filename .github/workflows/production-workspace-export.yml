name: Production workflow validation (temporary)
on:
  push:
    branches: [issue/230-work-1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: npm ci
      - run: npm test && npm run build
      - name: Format Rust and report patch
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff -- src-tauri > /tmp/rustfmt.patch
          cat /tmp/rustfmt.patch
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Rust storage tests
        run: cargo test --locked --manifest-path tests/storage/Cargo.toml
      - name: Rust transport tests
        run: cargo test --locked --manifest-path tests/llm/Cargo.toml
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/ui/production-workflow.spec.js tests/ui/source-library.spec.js tests/ui/layout.spec.js tests/ui/compositor.spec.js tests/ui/image-crop.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-workflow-validation
          path: |
            /tmp/rustfmt.patch
            test-results/
          retention-days: 3
