name: Compositor integration
on:
  pull_request:
    branches: [dev]
    paths: ['integrations/compositor/**', '.github/workflows/compositor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roundtrip:
    name: Pinned external Compositor RGBA roundtrip
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build separate pinned Compositor app
        run: bash integrations/compositor/build.sh "$RUNNER_TEMP/compositor-build"
      - name: Real app authenticated IPC and PNG fixture
        env:
          COMPOSITOR_TEST_OUTPUT: compositor-results
        run: python3 integrations/compositor/roundtrip.py "$RUNNER_TEMP/compositor-build/derived/Build/Products/Release/Compositor.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compositor-roundtrip
          path: compositor-results/
