[package]
name = "manga-blender-contracts"
version = "0.1.0"
edition = "2021"
[lib]
path = "../../src-tauri/src/blender.rs"
[dependencies]
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
